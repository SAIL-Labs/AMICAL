markdown_extensions:
- pymdownx.arithmatex:
    generic: true

extra_javascript:
- javascripts/mathjax.js
- https://polyfill.io/v3/polyfill.min.js?features=es6
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

site_name: AMICAL
nav:
- Home: index.md
- Installation: installation.md
- Getting Started: getting-started.ipynb
- Command-Line Interface: cli.md
- Tutorials:
  - NIRISS AMI Extraction: tutorials/niriss-extraction.ipynb
  - SPHERE IRD Extraction: tutorials/sphere-extraction.ipynb
  - SPHERE IFS Extraction: tutorials/sphere-ifs-extraction.ipynb
  - Companion Search: tutorials/companion-search.ipynb
- API: api/

theme:
  name: material
repo_url: https://github.com/SAIL-Labs/AMICAL
plugins:
- search
- mkdocs-jupyter
- gen-files:
    scripts:
    - scripts/gen_ref_pages.py
- literate-nav:
    nav_file: SUMMARY.md
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        options:
          show_docstring_modules: false
          docstring_style: numpy
