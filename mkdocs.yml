# TODO: Move tutorial.md to a notebook
# TODO: Move all scripts to notebooks
# TODO: Document the CLI
markdown_extensions:
- pymdownx.arithmatex:
    generic: true

extra_javascript:
- javascripts/mathjax.js
- https://polyfill.io/v3/polyfill.min.js?features=es6
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

site_name: AMICAL - Aperture Masking Interferometry Calibration and Analysis Library
nav:
- Home: index.md
- Installation: installation.md
- Tutorials:
        # TODO: Maybe rename quickstart or getting started?
  - General Tutorial: tutorial.md
  - NIRISS Tutorial: notebooks/example_NIRISS.ipynb
  - SPHERE Tutorial: notebooks/example_SPHERE.ipynb
  - Candid and Pymask: notebooks/example_analysis.ipynb
- API: api/

theme:
  name: material
repo_url: https://github.com/SydneyAstrophotonicInstrumentationLab/AMICAL
plugins:
- search
- mkdocs-jupyter
- gen-files:
    scripts:
    - scripts/gen_ref_pages.py
- literate-nav:
    nav_file: SUMMARY.md
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        options:
          show_docstring_modules: false
                    # TODO: Uniformize docstrings and make compatible with a standard
          docstring_style: numpy
