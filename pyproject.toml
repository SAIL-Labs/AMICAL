[build-system]
requires = ["flit_core>=4.1.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "amical"
version = "1.8.1"
description = "Extraction pipeline and analysis tools for Aperture Masking Interferometry mode of latest generation instruments (ground-based and space)."
authors = [
    { name = "Anthony Soulain", email = "anthony.soulain@univ-grenoble-alpes.fr" },
]
license = "MIT"
license-files = [
    "LICENSE",
    "src/amical/externals/munch/LICENSE",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: AIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "astropy>=5.0.1",
    "astroquery>=0.4.4",
    "h5py>=3.8.0",
    "matplotlib>=3.6.0",
    "numpy>=1.21.3",
    "packaging>=26.2",
    "pypdf>=6.19.0",
    "rich>=15.0.0",
    "scipy>=1.8.2",
]

[project.optional-dependencies]
# Model fitting of the calibrated OIFITS (and the legacy CANDID/Pymask
# functions) is computed with virgil, which needs Python >= 3.11.
virgil = [
    "virgil-astro>=0.2.0 ; python_version >= '3.11'",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/SydneyAstrophotonicInstrumentationLab/AMICAL"

[project.scripts]
amical = "amical._cli.main:main"

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "typecheck"},
    {include-group = "lint"},
    {include-group = "test"},
]
lint = [
    "pre-commit>=3.0",
    "ruff>=0.5",
    "black>=24.1",
]
typecheck = [
    "mypy>=2.1.0",
    "types-termcolor>=1.1.6.2",
]
test = [
    "pytest>=9.0.3",
    "virgil-astro>=0.2.0 ; python_version >= '3.11'",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25",
    "mkdocstrings[python]>=0.29",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[tool.uv]
no-build-package = [
    "matplotlib",
    "pillow",
    "contourpy",
    "kiwisolver",
    "scipy",
    "numpy",
    "astropy",
    "h5py",
    "pyerfa",
    "pyyaml",
]
constraint-dependencies = [
    "pyerfa>=2.0.0.2",
    "requests>=2.18.4",
    "urllib3>=1.26.6",
    "keyring>=20.0.0",
    # transitive dependencies of the optional virgil-astro (via optax/chex):
    # older releases are sdist-only and fail to build, which breaks
    # `uv sync --resolution=lowest`
    "absl-py>=1.0.0",
    "setuptools>=61.0",
    # transitive dependencies of the lint and docs groups (pre-commit,
    # mkdocs-jupyter/nbconvert/ipykernel), which `uv sync --resolution=lowest`
    # also resolves: older releases fail to build or to import
    "nodeenv>=1.6",
    "bleach>=6.0",
    "cffi>=2.0",
    "appnope>=0.1.2",
    "decorator>=5.0",
    "defusedxml>=0.7",
    "pyzmq>=27.0",
]

[tool.ruff.lint]
exclude = ["*__init__.py", "src/amical/externals/*"]
ignore = ["E501"]
select = [
    "E",
    "F",
    "W",
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "YTT", # flake8-2020
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
    # we run tests against a non-GUI backend on purpose
    "ignore:Matplotlib is currently using agg, which is a non-GUI backend, so cannot show the figure.:UserWarning",
    "ignore:FigureCanvasAgg is non-interactive, and thus cannot be shown:UserWarning",
    # np.product is used in h5py up to version 3.8.0
    # https://github.com/h5py/h5py/pull/2242
    "ignore:`product` is deprecated as of NumPy 1.25.0, and will be removed in NumPy 2.0. Please use `prod` instead.:DeprecationWarning",

    'ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated:DeprecationWarning', # https://github.com/dateutil/dateutil/pull/1285

    # https://github.com/matplotlib/matplotlib/pull/30221
    "ignore:'mode' parameter is deprecated and will be removed in Pillow 13:DeprecationWarning",

    # zodiax (a virgil dependency, up to at least 0.5.0) has unescaped LaTeX in
    # docstrings. The message starts with the offending sequence on
    # Python >= 3.14 ('"\\m" is an invalid escape sequence'), hence the leading .*
    "ignore:.*invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
omit = [
  "amical/externals/*",
]

[tool.coverage.report]
omit = [
  "amical/externals/*",
  "amical/dpfit.py",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
show_error_context = true
show_error_codes = true
